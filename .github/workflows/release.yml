name: Release
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      beta:
        description: 'Publish as beta (adds -beta to the tag)'
        type: boolean
        default: false
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CHANGELOG.md 맨 위 버전으로 태그를 만든다. 이미 있는 버전이면 배포하지 않고 넘어간다.
      - name: Create tag from CHANGELOG
        id: tag
        if: github.ref_type != 'tag'
        run: |
          ver=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2)
          [ -n "$ver" ] || { echo "No version found in CHANGELOG.md"; exit 1; }
          tag="v$ver"
          if [ "${{ inputs.beta }}" = "true" ]; then tag="$tag-beta"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - uses: BigWigsMods/packager@v2
        if: github.ref_type == 'tag' || steps.tag.outputs.release == 'true'

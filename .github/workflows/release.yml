name: Release
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      beta:
        description: 'Publish as beta (adds -beta to the tag)'
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 브랜치에서 실행된 경우: CHANGELOG.md 맨 위 버전으로 태그를 만들고, 그 태그로 이 워크플로를 다시 실행한다.
      # (패키저는 브랜치 푸시에서는 배포하지 않고 태그 실행에서만 배포한다.)
      # 같은 버전의 GitHub 릴리스가 이미 있으면 아무것도 하지 않는다.
      - name: Create tag from CHANGELOG
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2)
          [ -n "$ver" ] || { echo "No version found in CHANGELOG.md"; exit 1; }
          tag="v$ver"
          if [ "${{ inputs.beta }}" = "true" ]; then tag="$tag-beta"; fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to release."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a release - moving it to this commit."
            git push origin ":refs/tags/$tag"
          fi
          git tag -f "$tag"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
      - uses: BigWigsMods/packager@v2
        if: github.ref_type == 'tag'
